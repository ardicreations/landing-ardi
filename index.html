<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ardi Creations</title>

  <style>
    /* Reset básico */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      background: url('landing.jpg') no-repeat center center;
      background-size: cover;

      /* Fade-in */
      opacity: 0;
      animation: fadeIn 2s forwards;
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: scale(1.02); /* ligero zoom al inicio */
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Asegura que la imagen cubra toda la pantalla en móvil */
    @media (max-width: 768px) {
      body {
        background-size: cover;
      }
    }
  </style>
</head>
<body>
  <!-- Toda la landing es la imagen -->
</body>
</html>
