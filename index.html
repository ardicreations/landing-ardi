<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ardi Creations</title>

  <style>
    /* Reset básico */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }

    body {
      /* Imagen de fondo */
      background: url('landing.jpg') no-repeat center center;
      background-size: cover;
      opacity: 0;
      animation: fadeIn 1.5s forwards;
    }

    /* Animación fade-in */
    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    /* Para asegurar que la imagen cubra toda la pantalla en móvil */
    @media (max-width: 768px) {
      body {
        background-size: cover;
      }
    }
  </style>
</head>
<body>
  <!-- Toda la landing es la imagen, no hace falta contenido adicional -->
</body>
</html>
